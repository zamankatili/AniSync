name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: ESLint (errors only fail the build)
        run: npm run lint:eslint -- --max-warnings 10000

      - name: Unit tests
        run: npm test

      - name: Generated serverless bundles are fresh
        run: |
          npm run build:api
          git diff --exit-code -- api

      - name: Production build
        run: npm run build
