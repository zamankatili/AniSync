<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: notch / safe-area desteği. maximum-scale kaldırıldı (erişilebilirlik). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Title & Meta Description (İngilizce varsayılan; SEOManager istemcide dile göre günceller) -->
    <title>AniSync – Anime, Manga, Novel & Game Tracker, Watch Party & Community</title>
    <meta name="description" content="Discover anime, manga, light novels and games with AniSync; watch together in Watch Party rooms, play the Music Quiz, earn Otaku Rank badges and join the community. Türkçe: Watch Party ile canlı izleyin, Otaku Rank kazanın." />
    <meta name="keywords" content="anime, manga, light novel, games, anime tracker, anime calendar, watch party, anime quiz, otaku, anisync" />
    <meta name="author" content="AniSync" />

    <!-- PWA / Mobil -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AniSync" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.myanimelist.net" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://anisync-tau.vercel.app/" />

    <!-- OpenGraph Social Share Cards (Facebook, Discord, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniSync" />
    <meta property="og:title" content="AniSync – Watch Party, Anime Tracker & Community Platform" />
    <meta property="og:description" content="Track anime and manga, watch together live in Watch Party rooms, climb Otaku Rank and join the community. Live calendar, seasonal charts and real-time chat." />
    <meta property="og:image" content="https://cdn.myanimelist.net/images/anime/1015/138006l.webp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AniSync – Watch Party, Anime Tracker & Community Platform" />
    <meta name="twitter:description" content="Track anime, join Watch Party rooms, climb your Otaku Rank!" />
    <meta name="twitter:image" content="https://cdn.myanimelist.net/images/anime/1015/138006l.webp" />
    <!-- Dil alternatifleri (LanguageDetector `?lang=` parametresini okur) -->
    <link rel="alternate" hreflang="en" href="https://anisync-tau.vercel.app/?lang=en" />
    <link rel="alternate" hreflang="tr" href="https://anisync-tau.vercel.app/?lang=tr" />
    <link rel="alternate" hreflang="ja" href="https://anisync-tau.vercel.app/?lang=ja" />
    <link rel="alternate" hreflang="fr" href="https://anisync-tau.vercel.app/?lang=fr" />
    <link rel="alternate" hreflang="x-default" href="https://anisync-tau.vercel.app/" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AniSync",
      "alternateName": "AniSync LOGOS",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "All",
      "inLanguage": ["en", "tr", "ja", "fr"],
      "description": "Complete anime and manga tracking platform with Watch Party rooms, Otaku Rank achievements, Music Quiz and airing calendar. Anime, manga, oyun ve roman takip platformu.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TRY"
      }
    }
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-rose-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
